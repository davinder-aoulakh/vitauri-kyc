html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}

button{font-family:inherit}

.brand .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#3B6CF0,#1D4ED8);display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.brand b{display:block;color:#fff;font-size:14px}
.brand span{font-size:12px;color:var(--sideMut)}

.navscroll{flex:1;overflow-y:auto;padding:0 8px 10px}

.nav svg{flex:0 0 17px}
.nav .bd{margin-left:auto;font-size:11px;font-weight:600;padding:0 7px;border-radius:9px;background:#2A3F6B;color:#DCE5FA}

.me{border-top:1px solid #1D2F55;padding:10px 12px;display:flex;gap:10px;align-items:center}
.me .av{width:30px;height:30px;border-radius:15px;background:#26407A;color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.me b{color:#fff;font-size:13px;display:block}
.me span{font-size:11px;color:var(--sideMut)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;padding:10px 28px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
.topbar label{font-size:12.5px;color:var(--mut);display:flex;gap:6px;align-items:center}
.topbar select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff}
.page{padding:22px 32px 60px;max-width:1440px;width:100%}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}
.ph h1{margin:0;font-size:22px;font-weight:600}
.ph p{margin:3px 0 0;color:var(--mut);font-size:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px 18px}
.sec{font-size:14.5px;font-weight:600;margin:0}
.lbl{font-size:12px;color:var(--mut)}
.th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-left:4px solid var(--blue)}

.kpi .s{font-size:12.5px;color:var(--mut)}

.btn.pr{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.ail{border-color:var(--aiB);color:var(--ai)}
.btn.dg{border-color:#F3B5AE;color:var(--red)}

.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #D5DCE6;background:#fff;border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:#344054}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFBFD;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.mono{white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#F7F9FD}
.empty{padding:36px 20px;text-align:center;color:var(--mut)}

/* ================= MT940 ================= */
function parseMT940(text){
  const out=[]; const raw=text.replace(/\r/g,'');
  // split into statements by :20:
  const parts=raw.split(/\n(?=:20:)/);
  parts.forEach(part=>{
    if(!/:25:/.test(part)) return;
    const st={iban:'',open:null,close:null,tx:[],errors:[]};
    // join continuation lines into tags
    const tags=[]; part.split('\n').forEach(l=>{ if(/^:\d{2}[A-Z]?:/.test(l)) tags.push(l); else if(tags.length && l.trim() && l.trim()!=='-') tags[tags.length-1]+=l; });
    let cur=null;
    tags.forEach(t=>{
      const m=t.match(/^:(\d{2}[A-Z]?):(.*)$/); if(!m) return; const k=m[1], v=m[2];
      if(k==='25') st.iban=v.replace(/[^A-Z0-9]/gi,'').replace(/EUR$/,'');
      if(k==='60F'||k==='60M') st.open=bal(v);
      if(k==='62F'||k==='62M') st.close=bal(v);
      if(k==='61'){ const r=v.match(/^(\d{6})(\d{4})?(R?[CD])[A-Z]?([\d,]+)/); if(!r){ st.errors.push('Unreadable :61: line'); return; }
        const d='20'+r[1].slice(0,2)+'-'+r[1].slice(2,4)+'-'+r[1].slice(4,6); const amt=parseFloat(r[4].replace(',','.'))*(r[3].endsWith('D')?-1:1);
        cur={date:d,amt,rev:r[3].startsWith('R'),cp:'',cpIban:'',ref:'',raw86:''}; st.tx.push(cur); }
      if(k==='86'&&cur){ cur.raw86=v; const g=(c)=>{const x=v.match(new RegExp('/'+c+'/([^/]*)'));return x?x[1].trim():'';};
        cur.cp=g('NAME')||v.slice(0,40); cur.cpIban=g('IBAN'); cur.ref=g('REMI')||''; }
    });
    out.push(st);
  });
  return out;
}
function bal(v){ const m=v.match(/^([CD])(\d{6})([A-Z]{3})([\d,]+)/); if(!m) return null; return {sign:m[1],date:'20'+m[2].slice(0,2)+'-'+m[2].slice(2,4)+'-'+m[2].slice(4,6),cur:m[3],amt:parseFloat(m[4].replace(',','.'))*(m[1]==='D'?-1:1)}; }
function checkStatement(st,accId){
  const res=[]; const acc=S.accounts.find(a=>a.id===accId);
  res.push(acc&&acc.iban===st.iban?['ok','IBAN in file (:25:) matches account '+st.iban]:['bad','IBAN in file (:25: '+(st.iban||'missing')+') does not match account '+(acc?acc.iban:'')]);
  if(st.open&&st.close){ const sum=st.tx.reduce((s,x)=>s+x.amt,0); const diff=Math.round((st.open.amt+sum-st.close.amt)*100)/100;
    res.push(diff===0?['ok',`Opening balance ${eur(st.open.amt)} + movements ${eur(sum)} = closing balance ${eur(st.close.amt)}`]:['bad',`Balance does not reconcile: difference ${eur(diff)}`]); }
  else res.push(['warn','Opening or closing balance missing (:60F: / :62F:)']);
  const months=new Set(st.tx.map(x=>x.date.slice(0,7)));
  res.push(['ok',`${st.tx.length} transactions · ${st.tx.length?st.tx[0].date+' → '+st.tx[st.tx.length-1].date:''} · ${months.size} month(s)`]);
  const existing=new Set(S.txns.filter(x=>x.acc===accId).map(x=>x.date+'|'+x.amt+'|'+x.cpIban));
  const dup=st.tx.filter(x=>existing.has(x.date+'|'+x.amt+'|'+x.cpIban)).length;
  res.push(dup?['warn',`${dup} duplicate(s) with earlier uploads will be skipped`]:['ok','No duplicates with earlier uploads']);
  const own=st.tx.filter(x=>S.accounts.some(a=>a.cust===(acc&&acc.cust)&&a.iban===x.cpIban)).length;
  res.push(['ok',own?`${own} transfer(s) between the customer's own accounts recognised (not counted twice)`:'No transfers between own accounts']);
  const cutoff=new Date(TODAY); cutoff.setDate(cutoff.getDate()-S.tenant.histWindow);
  const hist=st.tx.filter(x=>new Date(x.date)<cutoff).length;
  res.push(['ok',`${hist} transaction(s) older than ${S.tenant.histWindow} days: analysis only, no alerts · ${st.tx.length-hist} can raise alerts`]);
  const newCp=new Set(st.tx.map(x=>x.cpIban||x.cp)).size;
  res.push(['ok',`${newCp} counterparties found in :86: (/NAME/, /IBAN/, /REMI/) · new ones screened via Didit presets`]);
  return {res,dup,ok:acc&&acc.iban===st.iban};
}

function readFile(file){ if(!file) return; const fr=new FileReader(); fr.onload=()=>{ W.text=String(fr.result); W.name=file.name; if(W.bulk) drawBulk(); else drawUpload(); }; fr.readAsText(file); }

function processStatement(st,accId){
  const acc=S.accounts.find(a=>a.id===accId); const c=cust(acc.cust); const cutoff=new Date(TODAY); cutoff.setDate(cutoff.getDate()-S.tenant.histWindow);
  const existing=new Set(S.txns.filter(x=>x.acc===accId).map(x=>x.date+'|'+x.amt+'|'+x.cpIban));
  const added=[]; let n=S.txns.length+1;
  st.tx.forEach(x=>{ if(existing.has(x.date+'|'+x.amt+'|'+x.cpIban)) return; const hist=new Date(x.date)<cutoff;
    const t={id:'T-'+(91000+n++),acc:accId,cust:acc.cust,date:x.date,amt:Math.round(x.amt*100)/100,cp:x.cp,cpIban:x.cpIban,cpC:(x.cpIban||'').slice(0,2),ref:x.ref,life:x.rev?'Reversed':'Booked',src:'MT940 upload',didit:hist?'Not submitted':'Approved',score:0,alert:null,hist};
    S.txns.push(t); added.push(t); });
  acc.status='Processed'; acc.last=st.close?st.close.date.split('-').reverse().join('-'):'—';
  // detection on recent
  const recent=added.filter(t=>!t.hist).sort((a,b)=>a.date.localeCompare(b.date));
  const alerts=[];
  const mk=(rule,src,score,why,prop,txs)=>{ const id=nextId('AL-',S.alerts); const a={id,cust:c.id,src,rule,score,due:'5 d',status:'New',ai:{p:prop,why},inv:null,txn:txs[0]&&txs[0].id,txns:txs.map(t=>t.id)}; S.alerts.unshift(a); txs.forEach(t=>{t.alert=id;t.didit='In review';t.score=score;}); alerts.push(a); };
  // structuring: distinct senders in 7 days, amount 1750-1999.99, threshold per risk class
  const need={Low:5,Medium:4,High:3}[c.risk]||4; const band=recent.filter(t=>t.amt>=1750&&t.amt<2000);
  for(let i=0;i<band.length;i++){ const start=new Date(band[i].date); const win=band.filter(t=>{const d=(new Date(t.date)-start)/864e5; return d>=0&&d<=7;}); const senders=new Set(win.map(t=>t.cpIban||t.cp));
    if(senders.size>=need){ mk('R-STRUCT-03 Structuring under threshold, 7 days, distinct senders','Rule',72,`${senders.size} different private senders in 7 days, each €1,750–1,999 (threshold for ${c.risk}: ${need})`,'Escalate',win); break; } }
  // rapid in/out
  const outs=recent.filter(t=>t.amt<0&&!/NL/.test(t.cpC)&&t.cpC);
  outs.forEach(o=>{ const ins=recent.filter(t=>t.amt>0&&(new Date(o.date)-new Date(t.date))/864e5>=0&&(new Date(o.date)-new Date(t.date))/864e5<=2&&!/SALARIS|SALARY/i.test(t.ref)); const inSum=ins.reduce((s,t)=>s+t.amt,0);
    if(inSum>0&&Math.abs(o.amt)>=0.8*inSum){ mk('R-RAPID-01 Rapid in/out within 48 h','Rule',74,`${Math.round(Math.abs(o.amt)/inSum*100)}% of ${eur0(inSum)} received forwarded to ${o.cpC} (${o.cp}) within 48 h`,'Escalate',[...ins,o]); } });
  // profile overrun per month
  let coc=null;
  if(c.profile){ const byM={}; recent.filter(t=>t.amt>0).forEach(t=>{const m=t.date.slice(0,7); byM[m]=(byM[m]||0)+t.amt;});
    Object.entries(byM).forEach(([m,v])=>{ if(v>c.profile.inMax*1.25){ mk('R-PROF-01 Inbound above expected profile ceiling','Profile',66,`${m}: inbound ${eur0(v)} vs ceiling ${eur0(c.profile.inMax)} (profile v${c.profile.version})`,'Escalate',recent.filter(t=>t.amt>0&&t.date.startsWith(m)));
      coc=`Inbound ${m} ${eur0(v)} vs ceiling ${eur0(c.profile.inMax)}; new country LT`; } }); }
  if(coc){ S.coc.unshift({id:nextId('CC-',S.coc),cust:c.id,src:'TM · profile deviation',text:coc,date:'03-11-2026',response:null,status:'Awaiting response',hold:false}); }
  if(alerts.length) c.beh=Math.max(c.beh||0,58+alerts.length*6);
  log('Vitauri','system',acc.iban,`MT940 processed: ${added.length} transactions (${added.filter(t=>t.hist).length} historical), ${alerts.length} alerts`);
  save();
  const ds=added.map(t=>t.date).sort();
  return {added:added.length,hist:added.filter(t=>t.hist).length,from:ds[0]||'—',to:ds[ds.length-1]||'—',cps:new Set(added.map(t=>t.cpIban)).size,alerts,coc};
}

  if(act==='wProcess'){ W.result=processStatement(W.st,W.acc); W.step=4; drawUpload(); renderNav(); }
  if(act==='wGo'){ const acc=S.accounts.find(x=>x.id===W.acc); closeModal(); if(a.dataset.to==='alerts'){ S.alerts.forEach(x=>{ if(x.status==='New') x.aiShown=true; }); go('alerts',{}); } else go('customer',{id:acc.cust,tab:'accounts'}); }
  if(act==='addAccount'){ modal('Add account',`<div class="g2"><div class="field"><label class="lbl" for="nIban">IBAN</label><input id="nIban" class="inp" placeholder="NL.."></div><div class="field"><label class="lbl" for="nType">Type</label><select id="nType" class="inp"><option>Own account (New Age Bank)</option><option>External account (PSD2)</option><option>Joint account</option><option>Business account</option></select></div><div class="field"><label class="lbl" for="nSrc">Source</label><select id="nSrc" class="inp"><option>Upload</option><option>PSD2</option><option>API</option></select></div><div class="field"><label class="lbl" for="nHold">Holders / related parties</label><input id="nHold" class="inp" value="${esc(cust(id).name)}"></div></div>`,`<button class="btn" data-close>Cancel</button><button class="btn pr" data-act="addAccountSave" data-id="${id}">Add account</button>`); }
  if(act==='addAccountSave'){ const iban=($('#nIban').value||'').replace(/\s/g,'').toUpperCase(); if(!/^[A-Z]{2}\d{2}[A-Z0-9]{8,30}$/.test(iban)){ toast('Enter a valid IBAN.'); return; } S.accounts.push({id:'A'+(S.accounts.length+1)+Date.now()%1000,cust:id,iban,type:$('#nType').value,holders:$('#nHold').value.split(',').map(s=>s.trim()),source:$('#nSrc').value,status:'No data yet',last:null}); save(); closeModal(); render(); toast('Account added.'); }
  if(act==='sendLink') toast('Secure link sent: the customer can upload statements or connect via PSD2. Blocked automatically while an AML hold is open.');
  if(act==='reauth'){ const acc=S.accounts.find(x=>x.id===id); acc.status='Re-auth link sent'; save(); render(); toast('PSD2 re-authentication link sent.'); }
  if(act==='scConfirm'||act==='scDismiss'){ const s=S.screening.find(x=>x.id===id); s.status=act==='scConfirm'?'Confirmed':'Dismissed'; if(act==='scConfirm'){ S.coc.unshift({id:nextId('CC-',S.coc),cust:s.cust,src:'Screening',text:'Confirmed hit: '+s.list+' · '+s.subject,date:'03-11-2026',response:null,status:'Awaiting response'}); toast('True match recorded → Change-of-circumstances event created.'); } else toast('Dismissed with rationale. Logged.'); log(S.role==='kyc'?'S. Visser':'david','human',s.id,'Screening: '+s.status); save(); render(); }
  if(act==='alClose'){ const al=S.alerts.find(x=>x.id===id); al.status='Closed'; log('R. de Wit','human',id,'Alert closed (reason recorded)'); save(); render(); toast(id+' closed. Reason and AI suggestion (followed/overridden) logged.'); }
  if(act==='alEsc'){ const al=S.alerts.find(x=>x.id===id); let inv=S.invs.find(i=>i.cust===al.cust&&!i.outcome&&S.tenant.grouping==='one_open_per_customer');
    if(!inv){ inv={id:nextId('INV-',S.invs),cust:al.cust,type:'TM investigation',status:'Investigation',owner:'R. de Wit',alerts:[],opened:'03-11-2026',fiu:null,outcome:null}; S.invs.unshift(inv); }
    inv.alerts.push(al.id); al.status='Escalated'; al.inv=inv.id; log('R. de Wit','human',id,'Escalated to '+inv.id); save(); go('inv',{id:inv.id}); toast(`${id} added to ${inv.id} (one open investigation per customer).`); }
  if(act==='invFiu'){ const inv=S.invs.find(x=>x.id===id); const fid='UTR-NL-0'+(940+S.fiu.length); S.fiu.unshift({id:fid,src:'AML investigation',origin:inv.id,cust:inv.cust,profile:'FIU-Netherlands',type:'UTR subjective',step:0,due:'without delay',ref:''}); inv.fiu=fid; inv.status='FIU report in preparation'; log('AI agent','ai',inv.id,'Prepared FIU report draft '+fid+' from KYC file, transactions and investigation'); save(); go('fiuDetail',{id:fid}); toast('Draft prepared by AI agent. Customer outreach locked (AML hold).'); }
  if(act==='invClose'){ const inv=S.invs.find(x=>x.id===id); inv.outcome=a.dataset.o; inv.status='Closed'; if(/True positive/.test(inv.outcome)) S.coc.unshift({id:nextId('CC-',S.coc),cust:inv.cust,src:'TM · investigation outcome',text:inv.id+' closed as true positive',restricted:true,date:'03-11-2026',response:null,status:'Awaiting response'}); log('R. de Wit','human',inv.id,'Closed: '+inv.outcome); save(); render(); toast('Investigation closed.'+(/True positive/.test(inv.outcome)?' Change-of-circumstances event sent to KYC.':'')); }
  if(act==='fiuStep'){ const f=S.fiu.find(x=>x.id===id); f.step=Math.min(f.step+1,5); if(f.step===5){ const inv=S.invs.find(i=>i.fiu===f.id); if(inv&&!inv.outcome&&f.step===5){ inv.outcome='Reported to FIU'; inv.status='Closed'; S.coc.unshift({id:nextId('CC-',S.coc),cust:f.cust,src:'TM · investigation outcome',text:inv.id+' closed with FIU report '+f.id,restricted:true,date:'03-11-2026',response:null,status:'Awaiting response',hold:true}); } } log(S.role==='co'?'M. Janssen':'R. de Wit','human',f.id,'FIU report → '+FIU_STEPS[f.step]); save(); render(); }
  if(act==='fiuSubmit'){ const f=S.fiu.find(x=>x.id===id); f.ref=($('#fiuRef').value||'').trim()||'goAML-NL-2026-004899'; f.step=4; log('R. de Wit','human',f.id,'Submission recorded · '+f.ref); save(); render(); }
  if(act==='bulk') openBulk();
  if(act==='bSample'){ const other=SAMPLE_MT940.replace('NL02ABNA0123456789','NL99ABNA0999999999').replace(':20:NAB2610STMT',':20:NAB2610STMX'); W.text=SAMPLE_MT940+'\n'+other; W.name='bulk_sample.mt940'; drawBulk(); }
  if(act==='bParse'){ W.sts=parseMT940(W.text); W.step=2; drawBulk(); }
  if(act==='bProcess'){ let n=0; S.unmatched=S.unmatched||[]; W.sts.forEach(st=>{ const acc=S.accounts.find(x=>x.iban===st.iban); if(acc){ processStatement(st,acc.id); n++; } else S.unmatched.push({iban:st.iban,n:st.tx.length,from:st.tx[0]?st.tx[0].date:'—',to:st.tx.length?st.tx[st.tx.length-1].date:'—'}); }); save(); closeModal(); render(); toast(`${n} statement(s) processed; ${W.sts.length-n} unmatched.`); }
});
document.addEventListener('change',e=>{
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act;
  if(act==='cocResp'&&a.value){ const c=S.coc.find(x=>x.id===a.dataset.id); c.response=a.value; if(a.value==='No action') c.status='Closed'; else { const rid=nextId('RV-',S.reviews); S.reviews.unshift({id:rid,cust:c.cust,type:'Event-driven review',status:'Scoping',owner:'S. Visser',due:'17-11-2026',origin:'CoC: '+c.src}); c.status='Review started'; c.review=rid; } log('S. Visser','human',c.id,'Response: '+a.value); save(); render(); toast(a.value==='No action'?'Closed with no action.':'Event-driven review started; only affected steps re-run.'); }
  if(act==='roleModel'){ S.tenant.roleModel=a.value; save(); render(); }
  if(act==='grouping'){ S.tenant.grouping=a.value; save(); render(); }
  if(act==='histWin'){ S.tenant.histWindow=Math.max(1,+a.value||30); save(); toast('Historical window set to '+S.tenant.histWindow+' days.'); }
});
$('#roleSel').addEventListener('change',e=>{ S.role=e.target.value; save(); render(); });
$('#notesTog').addEventListener('change',e=>{ S.notes=e.target.checked; save(); render(); });
$('#resetBtn').addEventListener('click',()=>{ S=seed(); save(); closeModal(); render(); toast('Demo reset.'); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
render();

</script>
</body></html>
